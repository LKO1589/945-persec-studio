<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>945 Persec Studio — Tattoo</title>
  <meta name="description" content="945 Persec Studio สตูดิโอสักลาย Flash, Minimal, Anime และ Merchandise">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <header class="site-header" id="siteHeader">
    <a class="logo" href="/">945 Persec Studio</a>
  </header>

  <main>
    <section class="hero">
      <div class="hero-text">
        <p class="eyebrow">Tattoo Studio</p>
        <h1 id="studioName">945 Persec<br>Studio</h1>
        <p class="tagline" id="tagline"></p>
        <a href="#works" class="btn">ดูผลงาน</a>
      </div>
      <div class="hero-media" id="heroMedia"></div>
    </section>

    <section class="section" id="works">
      <div class="section-head">
        <span class="num">01</span><h2>Works</h2>
      </div>
      <div class="cat-grid" id="catGrid">
        <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
      </div>
    </section>

    <section class="section split" id="about" hidden>
      <div class="section-head"><span class="num">02</span><h2>About</h2></div>
      <p class="prose" id="aboutText"></p>
    </section>

    <section class="section split" id="booking" hidden>
      <div class="section-head"><span class="num">03</span><h2>Booking</h2></div>
      <p class="prose" id="bookingText"></p>
    </section>

    <section class="section split" id="faq" hidden>
      <div class="section-head"><span class="num">04</span><h2>FAQ</h2></div>
      <div class="faq-list" id="faqList"></div>
    </section>
  </main>

  <footer class="site-footer" id="contact"></footer>

  <script type="module" src="/assets/js/home.js"></script>
</body>
</html>
