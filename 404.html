<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>945 Persec Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <header class="site-header" id="siteHeader">
    <a class="logo" href="/">945 Persec Studio</a>
  </header>

  <main>
    <section class="cat-hero">
      <a href="/" class="back">← ทั้งหมด</a>
      <h1 id="catName">&nbsp;</h1>
      <p class="prose" id="catDesc"></p>

    <button class="lb-prev" aria-label="ก่อนหน้า">‹</button>

      <img id="lbImg" alt="">

    </figure>
    <button class="lb-next" aria-label="ถัดไป">›</button>

  <script type="module" src="/assets/js/category.js"></script>
